# Blueprint do Render (https://render.com/docs/blueprint-spec).
# No painel do Render: New > Blueprint > escolha este repositório.
# Veja docs/deploy.md antes de usar.
services:
  - type: web
    name: django-kid
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-kid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      # Preencha no painel: SMTP para os e-mails de verificação e de senha.
      - key: EMAIL_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: django-kid-db
    databaseName: blog
    user: blog
    plan: free
    postgresMajorVersion: "17"
